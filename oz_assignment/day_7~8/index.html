<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>실시간 암호화폐 가격 변동 추적기</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <h1>실시간 암호화폐 가격 변동 추적기</h1>

        <div class="tabs">
            <button id="tab-all" class="active">전체보기</button>
            <button id="tab-favorites">관심항목</button>
        </div>

        <div class="search-container">
            <input type="text" id="search-input" placeholder="심볼 검색 (예: BTCUSDT)">
        </div>

        <table>
            <thead>
                <tr>
                    <th>관심</th>
                    <th>심볼</th>
                    <th>현재가</th>
                    <th>24시간 변동률</th>
                    <th>최고가</th>
                    <th>최저가</th>
                </tr>
            </thead>
            <tbody id="crypto-table-body">
            </tbody>
        </table>
    </div>

    <script src="main.js"></script>
</body>

</html>
