<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <!--ul= Unordered list 순서 없는 리스트-->

    <ul>
        <li>Apple</li>
        <li>Banana</li>
        <li>Cherry</li>
    </ul>

    <!--ol=Ordered List  순서가 있는 리스트-->
    <ol type="I"> <!-- type 속성은 리스트의 번호 스타일을 지정할 수 있습니다. A는 대문자 알파벳, a는 소문자 알파벳, 1은 숫자입니다.-->
        <li>Apple</li>
        <li>Banana</li>
        <li>Cherry</li>

    </ol>

</body>

</html>
