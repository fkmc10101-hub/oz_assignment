<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <button id="start">카운트다운 시작</button>
    <div id="result"></div>

    <script>
        const button = document.querySelector("#start");
        const result = document.querySelector("#result");

        let timerId = null;

        function startButton() {
            if (timerId !== null) {
                alert("이미 카운트다운이 진행 중입니다.");
                return; // 기존 타이머가 있으면 중복 실행 방지
            };

            //타이머 시작
            button.disabled = true; // 버튼 비활성화(이중방어)

            let count = 10;
            result.textContent = count; // 초기값 표시

            timerId = setInterval(() => {
                count--;
                result.textContent = count; // 업데이트된 값 표시

                if (count === 0) {
                    clearInterval(timerId);
                    timerId = null; // 타이머 초기화
                    alert("카운트다운 완료!");
                }
            }, 1000); // 1초마다 실행
        }

        // 💡 [여기가 빠졌었습니다!] 버튼에 클릭 이벤트 리스너를 추가합니다.
        button.addEventListener("click", startButton);
    </script>
</body>

</html>
